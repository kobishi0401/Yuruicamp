<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Yuruicamp 預約成功，查看預約編號與後續入住流程。" />
    <meta name="theme-color" content="#73816e" />
    <link rel="icon" href="/assets/icons/camping_icon.png" type="image/png" />
    <title>預約成功 | Yuruicamp 營地預約</title>

    <!-- 成功頁版型沿用主站 checkout-success 樣式 / Reuse main checkout-success styles -->
    <link rel="stylesheet" href="/storefront/css/main.css" />
    <link rel="stylesheet" href="/booking/css/booking-main.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
    />
  </head>
  <body>
    <div id="bookingHeader" class="bookingHeaderMount"></div>

    <main class="checkoutSuccessPage">
      <section class="checkoutSuccess" aria-labelledby="successTitle">
        <div class="checkoutSuccessDecoration checkoutSuccessDecorationTop" aria-hidden="true"></div>
        <div class="checkoutSuccessDecoration checkoutSuccessDecorationBottom" aria-hidden="true"></div>
        <div class="successIconWrap" aria-hidden="true"><span class="successIcon">✓</span></div>
        <div class="successContent">
          <h1 class="successTitle" id="successTitle">預約成功</h1>
          <p class="successDescription">
            感謝您的預約！我們已收到您的露營預約，確認信將寄送至您的信箱。
          </p>
          <dl class="orderNumberPanel">
            <dt class="orderNumberLabel">預約編號</dt>
            <dd class="orderNumberValue isLoading" id="bookingNumberDisplay" aria-live="polite">載入中...</dd>
          </dl>
          <div class="successActions">
            <a class="successAction successActionPrimary" href="./member-center.html">查看預約明細</a>
            <a class="successAction successActionSecondary" href="./camp-search.html">再預約一次露營</a>
          </div>

          <!-- 結帳後導購 / Post-checkout upsell -->
          <div class="checkoutUpsellBannerBooking bookingSuccessUpsell" id="upsellBanner">
            <p>🎉 喜歡這次的裝備體驗嗎？</p>
            <p>前往選購屬於你的露營裝備，下次露營更輕鬆。</p>
            <a href="../../storefront/pages/products.html" class="btn btnOutline btnFull">
              <i class="bi bi-shop"></i> 前往選購新裝備
            </a>
          </div>
        </div>
      </section>
    </main>

    <div id="bookingFooter"></div>

    <script src="/booking/js/layout.js"></script>
    <!-- 共用：config／formatters／api-mock／booking-api（見 booking/partials/booking-core-scripts.partial） -->
    <script src="/booking/js/booking-core-scripts.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
      $(function () {
        window.loadBookingSharedLayout && window.loadBookingSharedLayout();
      });
    </script>
    <script src="/storefront/js/components/success-effects.js" defer></script>
    <script>
      (function initBookingSuccessPage() {
        const bookingNumberDisplay = document.getElementById('bookingNumberDisplay');
        const displayText = resolveBookingDisplayText();
        if (bookingNumberDisplay) {
          bookingNumberDisplay.textContent = displayText || '—';
          bookingNumberDisplay.classList.remove('isLoading');
        }
      })();

      /** 組合顯示用預約編號（無 #）/ Build booking display code without hash */
      function resolveBookingDisplayText() {
        var fromQuery = readBookingIdFromQuery();
        if (fromQuery) {
          return formatBookingDisplay(fromQuery.id, fromQuery.displayNo);
        }

        try {
          var sessionBooking = JSON.parse(sessionStorage.getItem('lastCheckoutBooking') || 'null');
          if (sessionBooking) {
            return formatBookingDisplay(
              sessionBooking.id || sessionBooking.bookingId,
              sessionBooking.displayNo
            );
          }
        } catch (error) {
          console.warn('[booking-success] 讀取 sessionStorage 失敗', error);
        }

        try {
          var lastBooking = JSON.parse(localStorage.getItem('lastCheckoutBooking') || 'null');
          if (lastBooking) {
            return formatBookingDisplay(lastBooking.id || lastBooking.bookingId, lastBooking.displayNo);
          }
        } catch (error) {
          console.warn('[booking-success] 讀取 lastCheckoutBooking 失敗', error);
        }

        return '';
      }

      function formatBookingDisplay(id, displayNo) {
        if (window.formatBookingDisplayId) {
          return window.formatBookingDisplayId({ id: id, displayNo: displayNo }, displayNo);
        }
        var normalized = String(displayNo || id || '').replace(/^#/, '').trim();
        return normalized;
      }

      /** bookingId 優先，其次 bookingNum；displayNo query 可直接顯示 / Prefer bookingId, then bookingNum and displayNo */
      function readBookingIdFromQuery() {
        var params = new URLSearchParams(window.location.search);
        var bookingId = params.get('bookingId');
        var bookingNum = params.get('bookingNum');
        var displayNoParam = params.get('displayNo');
        var raw = (bookingId && bookingId.trim()) || (bookingNum && bookingNum.trim()) || '';
        if (!raw && displayNoParam && displayNoParam.trim()) {
          return { id: null, displayNo: displayNoParam.trim().replace(/^#/, '') };
        }
        if (!raw) return null;
        raw = raw.replace(/^#/, '').trim();
        // 若 query 已是 BK-0001 則直接顯示 / If query is already display code
        if (/^BK-/i.test(raw)) {
          return { id: raw, displayNo: raw.toUpperCase().replace(/^bk-/i, 'BK-') };
        }
        var displayNo = displayNoParam && displayNoParam.trim()
          ? displayNoParam.trim().replace(/^#/, '')
          : null;
        return { id: raw, displayNo: displayNo };
      }
    </script>
  </body>
</html>
