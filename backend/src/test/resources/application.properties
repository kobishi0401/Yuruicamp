# Tests assume local Docker Postgres with docs/latest_schema.sql applied.
spring.datasource.url=jdbc:postgresql://localhost:5433/yuruicamp
spring.datasource.username=postgres
# Must match docker-compose /.env POSTGRES_PASSWORD when RUN_BACKEND_IT=true
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

yuruicamp.firebase.enabled=false
yuruicamp.cors.allowed-origins=http://127.0.0.1:5173
# 整合測試直接呼叫逾時服務，避免背景排程修改開發資料。
yuruicamp.checkout.expiration-enabled=false
yuruicamp.booking.expiration-enabled=false

# 線 D：IT 一律走 stub，並使用沙箱 CMV 測試向量的 HashKey／HashIV。
yuruicamp.ecpay.stub=true
yuruicamp.ecpay.merchant-id=3002607
yuruicamp.ecpay.hash-key=pwFHCqoQZGmho4w6
yuruicamp.ecpay.hash-iv=EkRm7iFT261dpevs

