spring.application.name=backend

# 設定後端服務 port，前端可用 http://localhost:8080 呼叫 API。
server.port=8080

# 使用 H2 記憶體資料庫，方便第一階段快速開發與測試。
spring.datasource.url=jdbc:h2:mem:yuruicamp;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 啟用 H2 Console，開發時可從 /h2-console 查看資料。
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# 開發階段由 Hibernate 自動建立資料表，正式環境再改用 migration 工具。
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
