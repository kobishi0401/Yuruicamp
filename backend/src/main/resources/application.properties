spring.application.name=backend

spring.main.banner-mode=off


# Local defaults match docker-compose.yml; override with env vars in real deploys.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/yuruicamp}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
# HikariCP pool size. db-f1-micro has very few slots (~25); staging Cloud Run
# sets SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=3 so old+new revision can both start.
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAXIMUM_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MINIMUM_IDLE:2}

# Schema: Flyway applies classpath:db/migration on startup (V1 = baseline structure).
# Seed data is NOT in Flyway — run docs/seed/002-dev-seed.sql after the app has migrated.
# Hibernate only validates mappings; it must not create or mutate the schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway (enabled by spring-boot-starter-flyway; explicit for clarity).
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Date ISO-8601 is configured in JacksonConfig (Boot 4 / Jackson 3 no longer
# supports spring.jackson.serialization.write-dates-as-timestamps).

# CORS for Vite frontend (http://127.0.0.1:5173)
yuruicamp.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}

# Firebase Auth: verify ID tokens only (backend does NOT issue its own JWT).
# When enabled=false, DevFirebaseTokenVerifier accepts tokens starting with "dev:".
yuruicamp.firebase.enabled=${FIREBASE_ENABLED:false}
yuruicamp.firebase.credentials-path=${FIREBASE_CREDENTIALS:}
# 與前端 VITE_FIREBASE_PROJECT_ID／service account project_id 對齊
yuruicamp.firebase.project-id=${FIREBASE_PROJECT_ID:yuruicamp-2026}

# Checkout expiry scheduler scans unpaid orders every minute by default.
yuruicamp.checkout.expiration-enabled=${YURUICAMP_CHECKOUT_EXPIRATION_ENABLED:true}
yuruicamp.checkout.expiration-scan-ms=${YURUICAMP_CHECKOUT_EXPIRATION_SCAN_MS:60000}

# Booking expiration releases zone occupancy and active rental reservations.
yuruicamp.booking.expiration-enabled=${YURUICAMP_BOOKING_EXPIRATION_ENABLED:true}
yuruicamp.booking.expiration-scan-ms=${YURUICAMP_BOOKING_EXPIRATION_SCAN_MS:60000}

# ECPay（線 D）：本機預設 stub；Hash 預設為沙箱測試向量帳號（勿當正式金鑰）。
yuruicamp.ecpay.stub=${YURUICAMP_ECPAY_STUB:true}
yuruicamp.ecpay.merchant-id=${YURUICAMP_ECPAY_MERCHANT_ID:3002607}
yuruicamp.ecpay.hash-key=${YURUICAMP_ECPAY_HASH_KEY:pwFHCqoQZGmho4w6}
yuruicamp.ecpay.hash-iv=${YURUICAMP_ECPAY_HASH_IV:EkRm7iFT261dpevs}
yuruicamp.ecpay.payment-url=${YURUICAMP_ECPAY_PAYMENT_URL:https://payment-stage.ecpay.com.tw/Cashier/AioCheckOut/V5}
yuruicamp.ecpay.public-api-base-url=${YURUICAMP_ECPAY_PUBLIC_API_BASE_URL:http://localhost:8080/api}
yuruicamp.ecpay.frontend-base-url=${YURUICAMP_FRONTEND_BASE_URL:http://127.0.0.1:5173}
yuruicamp.ecpay.order-success-path=${YURUICAMP_ECPAY_ORDER_SUCCESS_PATH:/storefront/pages/checkout-success.html}
yuruicamp.ecpay.order-failure-path=${YURUICAMP_ECPAY_ORDER_FAILURE_PATH:/storefront/pages/checkout.html}
yuruicamp.ecpay.booking-success-path=${YURUICAMP_ECPAY_BOOKING_SUCCESS_PATH:/booking/pages/booking-success.html}
yuruicamp.ecpay.booking-failure-path=${YURUICAMP_ECPAY_BOOKING_FAILURE_PATH:/booking/pages/booking-checkout.html}

# ECPay 國內物流（超商 CVS FAMI）；本機預設 stub。
yuruicamp.ecpay-logistics.stub=${YURUICAMP_ECPAY_LOGISTICS_STUB:true}
yuruicamp.ecpay-logistics.merchant-id=${YURUICAMP_ECPAY_LOGISTICS_MERCHANT_ID:2000132}
yuruicamp.ecpay-logistics.hash-key=${YURUICAMP_ECPAY_LOGISTICS_HASH_KEY:5294y06JbISpM5x9}
yuruicamp.ecpay-logistics.hash-iv=${YURUICAMP_ECPAY_LOGISTICS_HASH_IV:v77hoKGq4kWxNNIS}
yuruicamp.ecpay-logistics.api-base-url=${YURUICAMP_ECPAY_LOGISTICS_API_BASE_URL:https://logistics-stage.ecpay.com.tw}
yuruicamp.ecpay-logistics.logistics-sub-type=${YURUICAMP_ECPAY_LOGISTICS_SUB_TYPE:FAMI}
yuruicamp.ecpay-logistics.home-logistics-sub-type=${YURUICAMP_ECPAY_LOGISTICS_HOME_SUB_TYPE:TCAT}
yuruicamp.ecpay-logistics.sender-name=${YURUICAMP_ECPAY_LOGISTICS_SENDER_NAME:Yuruicamp}
yuruicamp.ecpay-logistics.sender-cell-phone=${YURUICAMP_ECPAY_LOGISTICS_SENDER_PHONE:0912345678}
yuruicamp.ecpay-logistics.sender-zip-code=${YURUICAMP_ECPAY_LOGISTICS_SENDER_ZIP:100}
# sender-address / goods-name defaults (CJK) live in application.yml — UTF-8 safe

# n8n CS integration (server-to-server). Empty key rejects all /api/integrations/n8n/** calls.
yuruicamp.n8n.api-key=${YURUICAMP_N8N_API_KEY:}

# OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
