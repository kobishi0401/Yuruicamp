# Manual Staging deploy → GCP Cloud Run + Firebase Hosting.
# 中文：在 GitHub Actions 手動觸發；需先設定 Secrets（見 deploy/staging/README.md §6）。
name: Deploy Staging

on:
  workflow_dispatch:
    inputs:
      deploy_api:
        description: Build/push Docker image and deploy Cloud Run
        type: boolean
        default: true
      deploy_hosting:
        description: Build frontend and firebase deploy --only hosting
        type: boolean
        default: true

env:
  PROJECT_ID: yuruicamp-2026
  REGION: asia-east1
  SERVICE: yuruicamp-api-staging
  AR_REPO: yuruicamp
  IMAGE_TAG: staging
  SQL_INSTANCE: yuruicamp-pg-staging
  DB_NAME: yuruicamp
  DB_USER: yuruicamp_app
  # Override with repo Variable STAGING_API_BASE_URL if you set one; else default below in hosting job.
  STAGING_API_BASE_URL: https://yuruicamp-api-staging-952948108890.asia-east1.run.app/api
  FRONTEND_BASE_URL: https://yuruicamp.com
  CORS_ALLOWED_ORIGINS: https://yuruicamp.com,https://www.yuruicamp.com,https://yuruicamp-2026.web.app,https://yuruicamp-2026.firebaseapp.com,http://127.0.0.1:5173

jobs:
  deploy-api:
    name: Deploy API (Cloud Run)
    if: ${{ inputs.deploy_api }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Resolve Cloud SQL connection name
        id: sql
        run: |
          CONN="$(gcloud sql instances describe "$SQL_INSTANCE" --project="$PROJECT_ID" --format='value(connectionName)')"
          echo "connection_name=$CONN" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        working-directory: backend
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/backend:${IMAGE_TAG}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Write Cloud Run env file
        run: |
          DB_URL="jdbc:postgresql:///${DB_NAME}?cloudSqlInstance=${{ steps.sql.outputs.connection_name }}&socketFactory=com.google.cloud.sql.postgres.SocketFactory"
          cat > /tmp/run-env.yaml <<EOF
          DB_URL: '${DB_URL}'
          DB_USERNAME: '${DB_USER}'
          FIREBASE_ENABLED: 'true'
          FIREBASE_PROJECT_ID: '${PROJECT_ID}'
          FIREBASE_CREDENTIALS: '/secrets/firebase/credentials.json'
          YURUICAMP_ECPAY_STUB: 'false'
          YURUICAMP_ECPAY_LOGISTICS_STUB: 'false'
          YURUICAMP_FRONTEND_BASE_URL: '${FRONTEND_BASE_URL}'
          CORS_ALLOWED_ORIGINS: '${CORS_ALLOWED_ORIGINS}'
          YURUICAMP_ECPAY_PAYMENT_URL: 'https://payment-stage.ecpay.com.tw/Cashier/AioCheckOut/V5'
          YURUICAMP_ECPAY_LOGISTICS_API_BASE_URL: 'https://logistics-stage.ecpay.com.tw'
          EOF
          # Strip accidental leading spaces from heredoc lines (YAML keys must start at column 0).
          sed -i 's/^[[:space:]]*//' /tmp/run-env.yaml
          cat /tmp/run-env.yaml

      - name: Deploy Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --image="$IMAGE" \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --cpu=1 \
            --memory=1Gi \
            --min-instances=0 \
            --max-instances=3 \
            --timeout=300 \
            --add-cloudsql-instances="${{ steps.sql.outputs.connection_name }}" \
            --env-vars-file=/tmp/run-env.yaml \
            --set-secrets="DB_PASSWORD=yuruicamp-staging-db-password:latest,YURUICAMP_ECPAY_MERCHANT_ID=yuruicamp-staging-ecpay-merchant-id:latest,YURUICAMP_ECPAY_HASH_KEY=yuruicamp-staging-ecpay-hash-key:latest,YURUICAMP_ECPAY_HASH_IV=yuruicamp-staging-ecpay-hash-iv:latest,YURUICAMP_ECPAY_LOGISTICS_MERCHANT_ID=yuruicamp-staging-ecpay-logistics-merchant-id:latest,YURUICAMP_ECPAY_LOGISTICS_HASH_KEY=yuruicamp-staging-ecpay-logistics-hash-key:latest,YURUICAMP_ECPAY_LOGISTICS_HASH_IV=yuruicamp-staging-ecpay-logistics-hash-iv:latest,/secrets/firebase/credentials.json=yuruicamp-staging-firebase-sa:latest"

      - name: Set PUBLIC_API_BASE_URL
        run: |
          SERVICE_URL="$(gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)')"
          gcloud run services update "$SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --update-env-vars="YURUICAMP_ECPAY_PUBLIC_API_BASE_URL=${SERVICE_URL}/api"
          curl -fsS "${SERVICE_URL}/api/health"

  deploy-hosting:
    name: Deploy Hosting (Firebase)
    if: ${{ inputs.deploy_hosting }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend (MPA + firebase-app bundle)
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ env.STAGING_API_BASE_URL }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: |
          if [ -z "${VITE_FIREBASE_API_KEY}" ] || [ -z "${VITE_FIREBASE_APP_ID}" ]; then
            echo "Missing VITE_FIREBASE_* secrets. See deploy/staging/README.md §6." >&2
            exit 1
          fi
          npm run build

      - name: Assemble hosting-out
        shell: bash
        env:
          STAGING_API_BASE_URL: ${{ env.STAGING_API_BASE_URL }}
        run: |
          chmod +x deploy/staging/assemble-hosting.sh
          ./deploy/staging/assemble-hosting.sh

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Deploy Hosting
        run: firebase deploy --only hosting --project "$PROJECT_ID" --non-interactive
