# Continuous integration — no cloud deploy.
# 中文：PR／push 時跑測試，不部署 Staging。
name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - deploy

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend (Maven test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Ensure mvnw is executable
        run: chmod +x mvnw
      - name: Run tests
        run: ./mvnw -B test

  frontend-check:
    name: Frontend (install + write-env + vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        run: npm ci
      # CI 用假 Firebase 值只為通過 build；正式 Hosting 部署見 deploy-staging.yml
      - name: Production build (placeholder Firebase + local API)
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8080/api
          VITE_FIREBASE_API_KEY: ci-placeholder
          VITE_FIREBASE_AUTH_DOMAIN: example.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: example
          VITE_FIREBASE_STORAGE_BUCKET: example.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: "0"
          VITE_FIREBASE_APP_ID: "1:0:web:ci"
        run: npm run build
      - name: Assert firebase-app bundle exists
        run: |
          test -f dist-firebase-app/firebase-app.js
          ! grep -q "from 'firebase/" dist-firebase-app/firebase-app.js
          ! grep -q 'from "firebase/' dist-firebase-app/firebase-app.js
